name: Pocket Runtime Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - pocket-runtime-phase1

permissions:
  contents: read

env:
  ROOTFS_SHA256: 00a283c7d3e9ed2399b8d73175f92a3932b65e86925f7a5bd0fe0d4736e81e8a
  WINLATOR_71_APK_URL: https://github.com/brunodev85/winlator/releases/download/v7.1.0/Winlator_7.1.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Hydrate Winlator 7.1 rootfs asset
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="app/src/main/assets/imagefs.txz"

          if grep -q '^version https://git-lfs.github.com/spec/v1' "$ROOTFS"; then
            echo "Rootfs is an LFS pointer; hydrating from the matching official Winlator 7.1 APK."
            curl --fail --location --retry 4 --retry-all-errors \
              --output /tmp/Winlator_7.1.apk \
              "$WINLATOR_71_APK_URL"
            unzip -p /tmp/Winlator_7.1.apk assets/imagefs.txz > "$ROOTFS"
          fi

          ACTUAL_SIZE=$(stat -c%s "$ROOTFS")
          echo "Rootfs size: $ACTUAL_SIZE bytes"
          test "$ACTUAL_SIZE" -gt 150000000
          echo "$ROOTFS_SHA256  $ROOTFS" | sha256sum --check --strict

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;22.1.7171670" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify packaged runtime
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          PACKAGED_SIZE=$(unzip -l "$APK" assets/imagefs.txz | awk '/assets\/imagefs.txz$/ {print $1}')
          echo "Packaged rootfs size: $PACKAGED_SIZE bytes"
          test "$PACKAGED_SIZE" -gt 150000000
          unzip -p "$APK" assets/imagefs.txz | sha256sum --check --strict <(printf '%s  -\n' "$ROOTFS_SHA256")
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'; then
            echo "Unexpected armeabi-v7a libraries found" >&2
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-runtime-phase1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
